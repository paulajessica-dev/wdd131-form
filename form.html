<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wdd 131 - Product Review</title>
    <meta name="description" content="Product Review Form.">
    <meta name="author" content="Paula Jessica Silva">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">    
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">

            <fieldset >
                <label for="productName">Product Name *
                    <select id="productName" name="productName" required>
                        <option value="" disabled selected> Choose a Product ...</option>
                    </select>
                </label>
            </fieldset>
        
            <fieldset class="rating-group">
                <legend>Overall Rating *</legend>
                <label><span>☆</span><input type="radio" name="rating" value="1" required></label>
                <label><span>☆☆</span><input type="radio" name="rating" value="2" required></label>
                <label><span>☆☆☆</span><input type="radio" name="rating" value="3" required></label>
                <label><span>☆☆☆☆</span><input type="radio" name="rating" value="4" required></label>
                <label><span>☆☆☆☆☆</span><input type="radio" name="rating" value="5" required></label>
            </fieldset>

            <fieldset>
                <label for="installDate">Date of Installation *<input type="date" id="installDate" name="installDate" required></label>
                
            </fieldset>

            <fieldset class="features-group">
                <legend>Which features did you find useful in the product?<i>(Check all that apply).</i></legend>
                <label><input type="checkbox" id="durability" name="features" value="Durability">Durability</label>
                <label><input type="checkbox" id="ease" name="features" value="Ease of Use">Ease of Use</label>
                <label><input type="checkbox" id="performance" name="features" value="Performance">Performance</label>
                <label><input type="checkbox" id="design" name="features" value="Design">Design</label>
            </fieldset>
            
            <fieldset>
                <label for="review">Written Review<span class="optional">(Optional)</span></label>
                <textarea id="review" name="review"></textarea>
            </fieldset>

            <fieldset>
                <label for="userName">Your Name<span class="optional">(Optional)</span></label><input type="text" id="userName" name="userName">
            </fieldset>

            <input type="submit" value="Post Review">
            

        </form>

    </main>
    <footer>
        <p>
        ©<span id="currentyear"></span>
        🌺 Paula Jessica Silva 🌺
        Fortaleza, Ceará
    </p>
    <p id="lastModified"></p>
    </footer>
   
</body>
</html>
