<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wdd 131 - Product Review</title>
    <meta name="description" content="Submit a product review by rating products, selecting useful features, and sharing your experience with an easy-to-use review form.">
    <meta name="author" content="Paula Jessica Silva">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">    
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">

            <fieldset >
                <label for="productName">Product Name <span class="required">*</span>
                    <select id="productName" name="productName" required>
                        <option value="" disabled selected> Select a Product ...</option>
                    </select>
                </label>
            </fieldset>
        
            <fieldset class="rating-group">
                <legend>Overall Rating <span class="required">*</span></legend>
                <input type="radio" id="star1" name="rating" value="1" required><label for="star1">☆</label>
                <input type="radio" id="star2" name="rating" value="2" required><label for="star2">☆☆</label>
                <input type="radio" id="star3" name="rating" value="3" required><label for="star3">☆☆☆</label>
                <input type="radio" id="star4" name="rating" value="4" required><label for="star4">☆☆☆☆</label>
                <input type="radio" id="star5" name="rating" value="5" required><label for="star5">☆☆☆☆☆</label>

            </fieldset>

            <fieldset>
                <label for="installDate">Date of Installation <span class="required">*</span><input type="date" id="installDate" name="installDate" required></label>
                
            </fieldset>

            <fieldset class="features-group">
                <legend>Which features did you find useful in the product?<i>(Check all that apply).</i></legend>
                <input type="checkbox" id="durability" name="features" value="Durability"><label for="durability">Durability</label>
                <input type="checkbox" id="ease" name="features" value="Ease of Use"><label for="ease">Ease of Use</label>
                <input type="checkbox" id="performance" name="features" value="Performance"><label for="performance">Performance</label>
                <input type="checkbox" id="design" name="features" value="Design"><label for="design">Design</label>
            </fieldset>
            
            <fieldset>
                <label for="review">Written Review<span class="optional">(Optional)</span></label>
                <textarea id="review" name="review"></textarea>
            </fieldset>

            <fieldset>
                <label for="userName">Your Name<span class="optional">(Optional)</span></label><input type="text" id="userName" name="userName">
            </fieldset>

            <input type="submit" value="Post Review">
            

        </form>

    </main>
    <footer>
        <p>
        ©<span id="currentyear"></span>
        🌺 Paula Jessica Silva 🌺
        Fortaleza, Ceará
    </p>
    <p id="lastModified"></p>
    </footer>
   
</body>
</html>
